<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit New Artwork - Tam Son Art</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        .submit-wrapper { max-width: 800px; margin: 0 auto; padding: 100px 20px 80px; }
        .submit-wrapper h1 { font-family: var(--font-serif); font-size: clamp(2.5rem, 5vw, 4.5rem); font-weight: 400; font-style: italic; margin-bottom: 10px; }
        .submit-wrapper .desc { font-weight: 300; color: var(--text-muted); margin-bottom: 40px; }
        form#submitForm { display: flex; flex-direction: column; gap: 25px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-main); }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 14px 16px; border: 1px solid var(--border-color);
            background: var(--bg-color); font-family: var(--font-sans); font-size: 1rem;
            color: var(--text-main); border-radius: 4px; transition: border-color 0.3s ease, box-shadow 0.3s ease; outline: none;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: var(--accent-pink); box-shadow: 0 0 0 3px rgba(255, 94, 126, 0.1);
        }
        .form-group textarea { resize: vertical; min-height: 120px; }
        .form-group .helper { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
        button#submitBtn { align-self: flex-start; padding: 14px 40px; background: var(--text-main); color: var(--bg-color); border: none; font-family: var(--font-sans); font-size: 0.9rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; cursor: pointer; transition: background 0.3s ease; border-radius: 4px; margin-top: 10px; }
        button#submitBtn:hover { background: var(--accent-pink); }
        button#submitBtn:disabled { opacity: 0.6; cursor: not-allowed; }
        #formStatus { margin-top: 15px; padding: 12px 16px; border-radius: 4px; display: none; }
        #formStatus.success { display: block; background: #e6fffa; color: #0b6e4f; border: 1px solid #b3f0d1; }
        #formStatus.error { display: block; background: #ffe6e6; color: #b91c1c; border: 1px solid #f5c6c6; }
        @media (max-width: 768px) { .submit-wrapper { padding: 80px 20px 60px; } button#submitBtn { align-self: stretch; width: 100%; text-align: center; } }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">Tam Son Art</a>
            <ul class="nav-links">
                <li><a href="index.html#gallery">Gallery</a></li>
                <li><a href="index.html#exhibitions">Exhibitions</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
            <button class="menu-toggle" id="menuToggle" aria-label="Open menu"><span>MENU</span></button>
        </div>
    </nav>

    <main>
        <div class="container">
            <div class="submit-wrapper">
                <h1>Submit Artwork</h1>
                <p class="desc">Fill in the details below to add a new artwork to the system.</p>

                <form id="submitForm" autocomplete="off">
                    <div class="form-group">
                        <label for="id">Artwork ID</label>
                        <input type="text" id="id" name="id" placeholder="e.g. ts009" required>
                    </div>
                    <div class="form-group">
                        <label for="title">Artwork Title</label>
                        <input type="text" id="title" name="title" placeholder="e.g. The Great Unfurling Head" required>
                    </div>
                    <div class="form-group">
                        <label for="year">Year</label>
                        <input type="text" id="year" name="year" placeholder="e.g. 2026">
                    </div>
                    <div class="form-group">
                        <label for="dimensions">Dimensions</label>
                        <input type="text" id="dimensions" name="dimensions" placeholder="e.g. 260 x 150 cm">
                    </div>
                    <div class="form-group">
                        <label for="medium">Medium</label>
                        <input type="text" id="medium" name="medium" placeholder="e.g. Pencil crayon, and text markers">
                    </div>
                    <div class="form-group">
                        <label for="tags">Tags</label>
                        <input type="text" id="tags" name="tags" placeholder="e.g. LARGE-FORMATS, FLORA">
                    </div>
                    
                    <!-- Mới thêm: Giá tiền -->
                    <div class="form-group">
                        <label for="price">Price (USD)</label>
                        <input type="text" id="price" name="price" placeholder="e.g. $1,200">
                        <span class="helper">Leave blank if not for sale.</span>
                    </div>
                    
                    <!-- Mới thêm: Trạng thái -->
                    <div class="form-group">
                        <label for="status">Status</label>
                        <select id="status" name="status">
                            <option value="available">Available (For Sale)</option>
                            <option value="sold">Sold (Not available)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="image_url">Image URL(s)</label>
                        <input type="text" id="image_url" name="image_url" placeholder="e.g. images/prj_09/artwork.png">
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" placeholder="Write a detailed description of the artwork..."></textarea>
                    </div>

                    <button type="submit" id="submitBtn">Add Artwork</button>
                    <div id="formStatus"></div>
                </form>
            </div>
        </div>
    </main>

    <footer class="site-footer" id="site-footer">...</footer> <!-- Footer cũ giữ nguyên -->

    <script>
        // --- QUAN TRỌNG: Điền Web App URL mới nhất của bạn vào đây ---
        const API_URL = "https://script.google.com/macros/s/.../exec"; 

        document.getElementById('submitForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const statusDiv = document.getElementById('formStatus');
            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());

            btn.disabled = true; btn.innerText = 'Submitting...';
            statusDiv.className = ''; statusDiv.innerText = '';

            try {
                await fetch(API_URL, {
                    method: 'POST', mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                statusDiv.className = 'success';
                statusDiv.innerText = 'Artwork added successfully! Redirecting...';
                this.reset();
                setTimeout(() => { window.location.href = 'index.html#gallery'; }, 2000);
            } catch (error) {
                statusDiv.className = 'error';
                statusDiv.innerText = 'Error submitting artwork. Please try again.';
            } finally {
                btn.disabled = false; btn.innerText = 'Add Artwork';
            }
        });
    </script>
</body>
</html>
