<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết Di sản - Tam Son Art</title>
    <meta name="description" content="Khám phá câu chuyện chi tiết về các kỹ thuật, chất liệu và tác phẩm sơn mài tại Tam Son Art.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        .detail-wrapper { display: flex; flex-wrap: wrap; min-height: 60vh; align-items: flex-start; padding-top: 40px; padding-inline: 20px; }
        @media(min-width: 1024px) { .detail-wrapper { padding-inline: 0; padding-top: 90px; } }
        
        .detail-image-column { flex: 1; width: 50%; padding: 0 40px 60px 0; display: flex; flex-direction: column; align-items: flex-start; box-sizing: border-box; }
        .detail-image-column img { width: 100%; height: auto; object-fit: cover; background-color: #f9f6f5; border-radius: 4px; display: block; margin-bottom: 20px; }
        .detail-image-column img:last-child { margin-bottom: 0; }
        
        .detail-text-column { flex: 1; width: 50%; padding: 0 0 60px 60px; border-left: 1px solid var(--border-color); position: relative; display: flex; flex-direction: column; box-sizing: border-box; }
        .close-btn { position: absolute; top: 0; right: 0; width: 30px; height: 30px; cursor: pointer; transition: all 0.3s ease; color: var(--text-main); }
        .close-btn:hover { opacity: 0.6; transform: rotate(90deg); }
        .detail-title { font-family: var(--font-serif); font-size: clamp(32px, 3.5vw, 52px); font-weight: 400; margin-bottom: 30px; margin-top: 0; }
        .detail-meta { display: flex; flex-direction: column; gap: 8px; font-size: 0.9rem; font-weight: 300; color: var(--text-muted); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.05em; }
        .detail-content { font-size: 16px; line-height: 1.9; color: var(--text-main); max-width: 90%; margin-top: 20px; }
        .detail-content p + p { margin-top: 20px; }
        .detail-content h3 { font-family: var(--font-serif); font-size: 1.6rem; font-weight: 400; font-style: italic; margin-top: 30px; margin-bottom: 15px; }

        @media (max-width: 992px) {
            .detail-wrapper { flex-direction: column; min-height: auto; align-items: stretch; padding-top: 80px; }
            .detail-image-column, .detail-text-column { width: 100%; border-left: none; padding: 0 0 30px 0; }
            .detail-image-column { border-bottom: 1px solid var(--border-color); padding-bottom: 30px; }
            .detail-text-column { padding: 30px 0 60px; }
            .close-btn { right: 0; top: 5px; }
            .detail-content { max-width: 100%; }
        }

        /* Mobile Overlay Menu */
        .mobile-overlay { position: fixed; inset: 0; z-index: 200; background-color: var(--text-main); color: var(--bg-color); display: flex; flex-direction: column; overflow-y: auto; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.4s ease, visibility 0.4s ease; }
        .mobile-overlay.is-open { opacity: 1; visibility: visible; pointer-events: auto; }
        .mobile-overlay-header { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem var(--nav-padding-x, 2rem); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .mobile-brand { font-family: var(--font-serif); font-size: 1.1rem; font-weight: 400; font-style: italic; color: var(--bg-color); text-decoration: none; }
        .menu-close-top { background: none; border: none; color: var(--bg-color); font-family: var(--font-sans); font-size: 0.85rem; text-transform: uppercase; cursor: pointer; }
        .mobile-overlay-body { padding: 2rem var(--nav-padding-x, 2rem); }
        .mobile-nav-links { list-style: none; display: flex; flex-direction: column; gap: 20px; }
        .mobile-nav-links a { font-family: var(--font-serif); font-size: 2.5rem; color: var(--bg-color); text-decoration: none; transition: opacity 0.3s ease; }
        .mobile-nav-links a:hover { opacity: 0.6; }
        @media (max-width: 768px) { .mobile-overlay { display: flex; } }
        @media (min-width: 769px) { .mobile-overlay { display: none; } }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">Tam Son Art</a>
            <ul class="nav-links">
                <li><a href="index.html#gallery">Gallery</a></li>
                <li><a href="index.html#exhibitions">Exhibitions</a></li>
                <li><a href="heritage.html">Heritage</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <button class="menu-toggle" id="menuToggle" aria-label="Open menu"><span>MENU</span></button>
        </div>
    </nav>

    <div class="mobile-overlay" id="mobileOverlay">
        <div class="mobile-overlay-header">
            <a href="index.html" class="mobile-brand">Tam Son Art</a>
            <button class="menu-close-top" id="menuCloseTop"><span>CLOSE</span></button>
        </div>
        <div class="mobile-overlay-body">
            <ul class="mobile-nav-links">
                <li><a href="index.html#gallery" class="mobile-link">Gallery</a></li>
                <li><a href="index.html#exhibitions" class="mobile-link">Exhibitions</a></li>
                <li><a href="heritage.html" class="mobile-link">Heritage</a></li>
                <li><a href="contact.html" class="mobile-link">Contact</a></li>
            </ul>
        </div>
    </div>

    <main>
        <div class="container">
            <div class="detail-wrapper" id="detailContainer">
                <!-- Skeleton Loading -->
                <div class="detail-image-column">
                    <div class="skeleton" style="width: 100%; height: 60vh; border-radius: 4px; margin-bottom: 20px;"></div>
                    <div class="skeleton" style="width: 100%; height: 60vh; border-radius: 4px;"></div>
                </div>
                <div class="detail-text-column">
                    <div class="skeleton" style="width: 80%; height: 48px; border-radius: 4px; margin-bottom: 20px;"></div>
                    <div class="skeleton" style="width: 50%; height: 20px; border-radius: 4px; margin-bottom: 12px;"></div>
                    <div class="skeleton" style="width: 100%; height: 300px; border-radius: 4px; margin-top: 20px;"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer" id="site-footer">
        <div class="footer-info">
            <div class="footer-info-grid">
                <div class="footer-info-col">
                    <nav class="footer-nav" aria-label="Footer navigation">
                        <a href="index.html#gallery" class="footer-nav-link">GALLERY</a>
                        <a href="index.html#exhibitions" class="footer-nav-link">EXHIBITIONS</a>
                        <a href="heritage.html" class="footer-nav-link">HERITAGE</a>
                        <a href="contact.html" class="footer-nav-link">CONTACT</a>
                    </nav>
                </div>
                <div class="footer-info-col">
                    <div class="footer-info-lead">
                        <h3 class="footer-info-heading">TAM SON ART</h3>
                        <a href="#" target="_blank" rel="noopener noreferrer" class="footer-info-value footer-link">REPRESENTED BY TAM SON ART GALLERY</a>
                    </div>
                    <div class="footer-info-row"><span class="footer-info-label">EMAIL:</span><a href="mailto:vuquangcuong@gmail.com" class="footer-info-value">VUQUANGCUONG@GMAIL.COM</a></div>
                    <div class="footer-info-row"><span class="footer-info-label">WHATSAPP & PHONE:</span><a href="tel:+84912580018" class="footer-info-value">+84 912 580018</a></div>
                </div>
            </div>
        </div>
        <div class="footer-copyright"><span>© 2026 TAM SON ART</span></div>
    </footer>

    <script>
        const HERITAGE_DATA = [
            { id: 'hrt01', title: 'Nghệ thuật dát vàng lá trong sơn mài', date: '09.08.2026', category: 'Kỹ thuật', content: `<h3>Vàng lá - Chất liệu của ánh sáng</h3><p>Trong nghệ thuật sơn mài truyền thống Việt Nam, vàng lá không chỉ là một chất liệu quý giá mà còn là linh hồn làm bừng sáng toàn bộ tác phẩm. Quy trình dát vàng đòi hỏi sự tỉ mỉ tuyệt đối từ khâu chuẩn bị bề mặt, pha chế keo dán, đến việc đặt từng lớp vàng mỏng manh lên tranh.</p><p>Mỗi lá vàng có độ dày chỉ khoảng 0.1 micron. Người nghệ nhân phải dùng tay không hoặc dụng cụ chuyên dụng đặt chúng lên bề mặt sơn ướt. Chỉ cần một cơn gió nhẹ hoặc hơi thở cũng có thể làm thổi bay lớp vàng quý giá. Đây chính là lý do tại sao các tác phẩm sơn mài dát vàng luôn mang một vẻ đẹp sang trọng và đắt giá.</p><p>Khi ánh sáng chiếu vào bề mặt tác phẩm, những lớp vàng lá phản chiếu tạo ra hiệu ứng 3D sống động, khiến cho người xem có cảm giác như đang nhìn thấy một kho báu vô giá. Sự kết hợp giữa kỹ thuật lâu đời và sự kiên nhẫn tột cùng đã tạo ra những tuyệt tác vượt thời gian.</p>`, images: ['images/tamson_art_01.png','images/tamson_art_03.png'] },
            { id: 'hrt02', title: 'Vỏ trứng: Từ phế liệu đến tuyệt tác sơn mài', date: '02.08.2026', category: 'Chất liệu', content: `<h3>Vẻ đẹp tiềm ẩn trong những mảnh vỡ</h3><p>Ít ai biết rằng, những mảnh vỏ trứng tưởng chừng như vô dụng lại là một trong những vật liệu tạo nên sự đặc sắc nhất của tranh sơn mài Việt Nam. Kỹ thuật ghép vỏ trứng (hay còn gọi là khảm vỏ trứng) là một trong những kỹ thuật khó nhất trong bộ môn nghệ thuật này.</p><p>Để có được một bề mặt khảm vỏ trứng đều đẹp, nghệ nhân phải trải qua hàng giờ đồng hồ làm sạch, tách lớp màng, mài mỏng và gắn từng miếng nhỏ vỏ trứng lên bề mặt tranh. Mỗi mảnh ghép tượng trưng cho một tế bào của bức tranh lớn.</p><p>Màu trắng ngần đặc trưng của vỏ trứng khi được phủ lớp sơn trong suốt bên trên sẽ tạo ra những mảng khảm lung linh tựa những vì sao trên bầu trời đêm, vừa cổ kính vừa gần gũi.</p>`, images: ['images/tamson_art_04.png','images/tamson_art_05.png'] },
            { id: 'hrt03', title: 'Hơi thở đương đại trong Sơn mài Việt', date: '25.07.2026', category: 'Phong cách', content: `<h3>Hành trình từ truyền thống đến hiện đại</h3><p>Nghệ thuật sơn mài Việt Nam đã trải qua hàng nghìn năm lịch sử. Từ những bức tranh thờ cúng thuở sơ khai, sơn mài đã dần khẳng định vị thế của mình trong dòng chảy mỹ thuật đương đại. Một trong những yếu tố giúp sơn mài không bị lãng quên chính là sự cởi mở trong việc thử nghiệm phong cách.</p><p>Các nghệ nhân trẻ ngày nay không ngừng sáng tạo bằng cách đưa vào tác phẩm những khối màu khỏe khoắn, đường nét tối giản và chủ đề đời sống hiện đại, thay vì chỉ gói gọn trong những họa tiết truyền thống. Sự giao thoa này đã tạo ra một ngôn ngữ mới cho sơn mài Việt Nam: vừa bảo tồn bản sắc dân tộc, vừa mang tính quốc tế.</p><p>Đó cũng chính là triết lý mà Tam Son Art theo đuổi: "Cổ điển làm nền tảng, hiện đại làm hơi thở".</p>`, images: ['images/tamson_art_02.png'] },
            { id: 'hrt04', title: 'Hình tượng tâm linh trong tranh sơn mài', date: '18.07.2026', category: 'Tín ngưỡng', content: `<h3>Gửi gắm khát vọng và niềm tin</h3><p>Trong văn hóa Việt Nam, tranh sơn mài thường gắn liền với đời sống tâm linh và tín ngưỡng. Từ các đình chùa đến cung điện, những bức sơn mài luôn hiện diện như một cầu nối giữa đời sống trần tục và thế giới thần linh. Các họa tiết như rồng, phượng, tứ linh, hay những hình ảnh cây lá mang biểu tượng thiêng liêng xuất hiện rất thường xuyên.</p><p>Đằng sau những đường nét tỉ mỉ ấy là ẩn chứa những thông điệp về sự trường tồn, về mùa màng tươi tốt và khát vọng sống của con người. Chất liệu vàng lá, vỏ trứng, cánh gián... dù là những vật chất vô tri, nhưng dưới bàn tay của người nghệ nhân chúng trở thành vật dẫn để gửi gắm những ước nguyện chân thành đến thế giới tâm linh.</p><p>Việc bảo tồn và phát huy những giá trị tín ngưỡng qua sơn mài cũng chính là một cách để thế hệ hôm nay tri ân tổ tiên và gìn giữ bản sắc dân tộc.</p>`, images: ['images/tamson_art_08.png','images/tamson_art_06.png'] }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id'); 
            const container = document.getElementById('detailContainer');

            if (!articleId) {
                container.innerHTML = `<div style="width:100%; height: 60vh; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:20px; text-align:center;"><a href="heritage.html" style="margin-top:20px; padding: 10px 20px; background: var(--text-main); color: var(--bg-color); text-decoration:none;">Quay lại</a></div>`;
                return;
            }
            const data = HERITAGE_DATA.find(item => String(item.id).trim() === String(articleId).trim());
            if (!data) {
                container.innerHTML = `<div style="width:100%; text-align:center; padding:100px 20px; color:var(--text-muted);">Không tìm thấy bài viết.</div>`;
                return;
            }
            const imagesHTML = data.images.map(url => `<img src="${url}" alt="${data.title}">`).join('');
            container.innerHTML = `
                <div class="detail-image-column">${imagesHTML}</div>
                <div class="detail-text-column">
                    <a href="heritage.html" class="close-btn" aria-label="Close details"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></a>
                    <h1 class="detail-title">${data.title}</h1>
                    <div class="detail-meta"><span>${data.date} · ${data.category}</span></div>
                    <div class="detail-content">${data.content}</div>
                </div>
            `;

            const menuToggle = document.getElementById('menuToggle');
            const menuCloseTop = document.getElementById('menuCloseTop');
            const mobileOverlay = document.getElementById('mobileOverlay');
            if (menuToggle && mobileOverlay) {
                menuToggle.addEventListener('click', () => { mobileOverlay.classList.add('is-open'); document.body.style.overflow = 'hidden'; });
                if (menuCloseTop) menuCloseTop.addEventListener('click', () => { mobileOverlay.classList.remove('is-open'); document.body.style.overflow = 'auto'; });
                mobileOverlay.querySelectorAll('.mobile-link').forEach(link => { link.addEventListener('click', () => { mobileOverlay.classList.remove('is-open'); document.body.style.overflow = 'auto'; }); });
            }

            const footer = document.getElementById('site-footer');
            let footerRevealed = false;
            function checkFooterReveal() { if (footerRevealed) return; const rect = footer.getBoundingClientRect(); if (rect.top < window.innerHeight) { footerRevealed = true; footer.classList.add('footer-motion-visible'); } }
            window.addEventListener('scroll', checkFooterReveal, { passive: true });
            window.addEventListener('resize', checkFooterReveal, { passive: true });
            checkFooterReveal();
        });
    </script>
</body>
</html>
