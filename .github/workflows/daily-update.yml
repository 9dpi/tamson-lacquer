name: Daily Update Exhibitions

on:
  schedule:
    # 01:00 UTC = 08:00 gio Viet Nam (UTC+7)
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Chay update.bat (them bai moi vao exhibitions.html)
        shell: cmd
        run: update.bat

      - name: Commit va push len GitHub
        shell: cmd
        run: |
          git config user.name "TamSonArt Bot"
          git config user.email "actions@github.com"
          git add exhibitions.html
          git diff --cached --quiet || (
            git commit -m "Update exhibitions %date%"
            git push origin master
          )
